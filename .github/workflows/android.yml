name: Android debug APK

on:
  push:
    paths:
      - 'android/**'
      - 'admin-android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [android, admin-android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36.1' 'build-tools;36.0.0'
      - name: Build debug APK
        working-directory: ${{ matrix.project }}
        run: chmod +x gradlew && ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.project }}-debug-apk
          path: ${{ matrix.project }}/app/build/outputs/apk/debug/app-debug.apk
