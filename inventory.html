<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario | SPLASH</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #edf3ff;
      --primary: #102a43;
      --primary-2: #1f5ea8;
      --accent: #2bc48a;
      --text: #10213a;
      --muted: #5e6b7c;
      --border: #dfeaf5;
      --shadow: 0 18px 35px rgba(17, 36, 64, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      box-shadow: var(--shadow);
    }

    .inventory-menu-toggle {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 30;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 14px 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 6px;
      color: #fff;
      background: var(--primary);
      box-shadow: 0 10px 28px rgba(16, 42, 67, 0.18);
      font-weight: 700;
      cursor: pointer;
    }

    .inventory-menu-toggle:hover {
      background: #1f4968;
    }

    .inventory-menu-toggle span:first-child {
      font-size: 1.35rem;
      line-height: 1;
    }

    .inventory-menu-toggle-label {
      font-size: 0.78rem;
    }

    .inventory-backdrop {
      position: fixed;
      inset: 0;
      z-index: 18;
      background: rgba(16, 42, 67, 0.28);
      backdrop-filter: blur(2px);
    }

    .inventory-backdrop[hidden] {
      display: none;
    }

    .brand {
      color: #fff;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 600;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.08);
      transition: 0.2s ease;
    }

    .nav a.active,
    .nav a:hover {
      background: rgba(255,255,255,0.18);
    }

    .layout {
      width: min(1320px, calc(100% - 24px));
      margin: 22px auto 56px;
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      transition: grid-template-columns 0.25s ease;
    }

    body.sidebar-collapsed .layout {
      grid-template-columns: 0 minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 90px;
      height: calc(100vh - 110px);
      overflow-y: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 18px 14px;
      box-shadow: var(--shadow);
      scrollbar-width: thin;
      scrollbar-color: #a7b9d8 transparent;
      transition: transform 0.3s ease, opacity 0.2s ease;
    }

    body.sidebar-collapsed .sidebar {
      display: none;
    }

    .sidebar::-webkit-scrollbar {
      width: 8px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #d0dbee;
      border-radius: 999px;
    }

    .sidebar-section {
      margin-bottom: 18px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .sidebar-title {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin: 0 0 10px;
      font-weight: 700;
    }

    .sidebar-list {
      display: grid;
      gap: 8px;
    }

    .sidebar-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--primary);
      background: #f7faff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 600;
    }

    .sidebar-link.active {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: #fff;
      border-color: transparent;
    }

    .saved-list {
      display: grid;
      gap: 10px;
    }

    .saved-item {
      background: #f8fbff;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: left;
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
    }

    .content {
      display: grid;
      gap: 22px;
    }

    .shell {
      display: grid;
      gap: 22px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .header-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
      color: var(--primary);
    }

    .subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(43, 196, 138, 0.12);
      color: #116d4d;
      border: 1px solid rgba(43, 196, 138, 0.28);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .status-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      display: block;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        opacity: 1;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.8;
      }
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(180px, 1fr));
      gap: 18px;
    }

    .inventory-card {
      background: linear-gradient(180deg, #ffffff 0%, var(--panel-soft) 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .inventory-card h2 {
      margin: 0;
      font-size: 1.15rem;
      color: var(--primary);
    }

    .qty-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      color: var(--muted);
    }

    .qty-row input {
      width: 90px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 1rem;
      text-align: center;
      color: var(--primary);
      background: #fff;
    }

    .status-dropdown {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }

    .status-dropdown-toggle {
      width: 100%;
      padding: 8px 10px;
      background: #f8fbff;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: none;
      border-radius: 0;
    }

    .status-dropdown-toggle:hover {
      background: #edf3ff;
      transform: none;
    }

    .status-dropdown-toggle .dropdown-arrow {
      transition: transform 0.2s ease;
    }

    .status-dropdown.open .status-dropdown-toggle .dropdown-arrow {
      transform: rotate(180deg);
    }

    .status-dropdown-content {
      display: none;
      padding: 10px;
      gap: 8px;
      flex-direction: column;
    }

    .status-dropdown.open .status-dropdown-content {
      display: flex;
    }

    .status-dropdown-content label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 600;
    }

    .status-dropdown-content input {
      width: 80px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.9rem;
      text-align: center;
      color: var(--primary);
      background: #fff;
    }

    .report-box {
      display: grid;
      gap: 18px;
    }

    .report-box textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--primary);
      background: #f8fbff;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .whatsapp {
      background: #25d366;
      color: white;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-2) 100%);
      color: white;
    }

    .secondary {
      background: #edf4ff;
      color: var(--primary);
      border: 1px solid #dfeaf5;
    }

    .small-note {
      color: var(--muted);
      font-size: 0.9rem;
      margin: 0;
    }

    @media (max-width: 760px) {
      .topbar {
        padding: 14px 16px;
        flex-direction: column;
        align-items: flex-start;
      }

      .nav {
        width: 100%;
      }

      .nav a {
        flex: 1 1 140px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 20;
        width: min(84vw, 300px);
        height: 100vh;
        max-height: none;
        border-radius: 0 18px 18px 0;
        transform: translateX(-110%);
        opacity: 0;
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
        opacity: 1;
      }

      body.sidebar-collapsed .layout {
        grid-template-columns: 1fr;
      }

      body.sidebar-open .inventory-backdrop {
        display: block;
      }

      .inventory-grid {
        grid-template-columns: 1fr;
      }

      .header-box {
        flex-direction: column;
        align-items: flex-start;
      }

      .panel {
        padding: 18px 16px;
      }
    }
  </style>
</head>
<body>
  <button class="inventory-menu-toggle" id="inventoryMenuToggle" type="button" aria-expanded="false" aria-controls="inventorySidebar" aria-label="Abrir menú de navegación">
    <span>☰</span>
    <span class="inventory-menu-toggle-label">Menú</span>
  </button>
  <div class="inventory-backdrop" id="inventoryBackdrop" hidden></div>

  <header class="topbar">
    <div class="brand">SPLASH Sede Las Flores</div>
    <nav class="nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a class="active" href="inventory.html">Inventario</a>
    </nav>
  </header>

  <main class="layout">
    <aside class="sidebar" id="inventorySidebar" aria-label="Barra lateral de inventario">
      <div class="sidebar-section">
        <p class="sidebar-title">Navegación</p>
        <div class="sidebar-list">
          <a class="sidebar-link" href="index.html">🏠 Inicio</a>
          <a class="sidebar-link active" href="inventory.html">📦 Inventario</a>
        </div>
      </div>

      <div class="sidebar-section">
        <p class="sidebar-title">Registros guardados</p>
        <div class="saved-list" id="savedList"></div>
      </div>
    </aside>

    <div class="content">
      <main class="shell">
        <section class="panel header-box">
          <div>
            <h1>Inventario general</h1>
            <p class="subtitle">Control operativo, mantenimiento y material de apoyo.</p>
          </div>
          <div class="status-badge">Sincronizado local</div>
        </section>

        <section class="panel">
          <div class="inventory-grid" id="inventoryGrid">
            <!-- Se cargará dinámicamente desde el servidor -->
          </div>
        </section>

        <section class="panel report-box">
          <div>
            <h2 style="margin:0 0 12px; color: var(--primary);">Texto para copiar y enviar</h2>
            <textarea id="reportText" aria-label="Texto del inventario para copiar"></textarea>
          </div>

          <div class="actions">
            <button class="primary" type="button" id="copyButton">Copiar texto</button>
            <button class="secondary" type="button" id="saveButton">Guardar registro</button>
            <button class="whatsapp" type="button" id="shareButton">Compartir por WhatsApp</button>
            <a href="index.html" style="text-decoration: none;"><button class="secondary" type="button">Volver al inicio</button></a>
          </div>
          <p class="small-note" id="statusMessage" role="status" aria-live="polite">Listo para copiar y guardar.</p>
        </section>
      </main>
    </div>
  </main>

  <script>
    const reportText = document.getElementById('reportText');
    const statusMessage = document.getElementById('statusMessage');
    const savedList = document.getElementById('savedList');
    const inventoryGrid = document.getElementById('inventoryGrid');
    const menuToggle = document.getElementById('inventoryMenuToggle');
    const inventoryBackdrop = document.getElementById('inventoryBackdrop');
    const inventorySidebar = document.getElementById('inventorySidebar');
    const storageKey = 'splash-inventory-history';
    const SUPABASE_URL = 'https://yyhvpbgvmnhonyqzevfr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl5aHZwYmd2bW5ob255cXpldmZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTMwNTEsImV4cCI6MjEwNDk4OTA1MX0.V4bE69TXc7FuxogGhCszhN0O-9XF4jfoXGgYrYGY-i0';

    function inventoryHeaders(extra = {}) {
      return { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}`, ...extra };
    }

    async function inventoryFetch(options = {}) {
      const method = options.method || 'GET';
      if (method === 'GET') {
        return fetch(`${SUPABASE_URL}/rest/v1/inventory?select=name,owner,borrower,non_operative,no_solution,updated_at&order=name.asc`, { headers: inventoryHeaders() });
      }
      return fetch(`${SUPABASE_URL}/rest/v1/inventory?on_conflict=name`, {
        method: 'POST',
        headers: inventoryHeaders({ 'Content-Type': 'application/json', Prefer: 'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify([JSON.parse(options.body || '{}')])
      });
    }

    let inventoryItems = [
      { name: 'Turbinas', qty: 17, non_operative: '0', no_solution: '0' },
      { name: 'Aspiradoras', qty: 19, non_operative: '0', no_solution: '0' },
      { name: 'Taladros', qty: 20, non_operative: '0', no_solution: '0' },
      { name: 'Pulverizadores', qty: 20, non_operative: '0', no_solution: '0' },
      { name: 'Extensiones', qty: 0, non_operative: '0', no_solution: '0' },
      { name: 'Mochilas', qty: 0, non_operative: '0', no_solution: '0' }
    ];

    let lastSyncTime = 0;
    let lastCheckTime = 0;

    async function loadInventoryFromServer() {
      try {
        const response = await inventoryFetch();
        const data = await response.json();
        if (Array.isArray(data) && data.length > 0) {
          inventoryItems = data.map((item) => ({
            name: item.name,
            qty: parseInt(item.owner || item.borrower || '0') || 0,
            non_operative: item.non_operative || '0',
            no_solution: item.no_solution || '0',
            updated_at: item.updated_at
          }));
          renderInventoryCards();
          updateReportText();
        }
      } catch (error) {
        console.error('Error al cargar inventario:', error);
      }
    }

    function buildInventoryReportText() {
      if (!inventoryItems.length) return 'Sin herramientas registradas.';
      const timestamp = new Date().toLocaleString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
      const header = `INVENTARIO ACTUALIZADO - ${timestamp}\n\n`;

      const colOperativos = inventoryItems.map((item) => `${item.name}(${item.qty})`);
      const colNoOperativos = inventoryItems
        .map((item) => ({ name: item.name, qty: parseInt(item.non_operative || '0') }))
        .filter((item) => item.qty > 0)
        .map((item) => `${item.name}(${item.qty})`);
      const colSinSolucion = inventoryItems
        .map((item) => ({ name: item.name, qty: parseInt(item.no_solution || '0') }))
        .filter((item) => item.qty > 0)
        .map((item) => `${item.name}(${item.qty})`);

      let result = `${header}OPERATIVOS\n${colOperativos.length ? colOperativos.join('\n') : 'Sin datos'}`;
      if (colNoOperativos.length) result += `\n\nNO OPERATIVOS\n${colNoOperativos.join('\n')}`;
      if (colSinSolucion.length) result += `\n\nSIN SOLUCIÓN\n${colSinSolucion.join('\n')}`;
      return result;
    }

    function updateReportText() {
      reportText.value = buildInventoryReportText();
    }

    function renderInventoryCards() {
      inventoryGrid.innerHTML = inventoryItems.map((item, idx) => `
        <div class="inventory-card">
          <h2>${item.name}</h2>
          <label class="qty-row">
            <span>Cantidad</span>
            <input type="number" value="${item.qty}" min="0" data-item-index="${idx}" class="inventory-input">
          </label>
          <div class="status-dropdown" data-item-index="${idx}">
            <button type="button" class="status-dropdown-toggle" data-item-index="${idx}">
              <span>No operativos / Sin solución</span>
              <span class="dropdown-arrow">&#9662;</span>
            </button>
            <div class="status-dropdown-content">
              <label>No operativos
                <input type="number" value="${item.non_operative}" min="0" data-item-index="${idx}" data-field="non_operative" class="status-input">
              </label>
              <label>Sin solución
                <input type="number" value="${item.no_solution}" min="0" data-item-index="${idx}" data-field="no_solution" class="status-input">
              </label>
            </div>
          </div>
        </div>
      `).join('');

      // Agregar listeners a los inputs de cantidad
      document.querySelectorAll('.inventory-input').forEach((input) => {
        input.addEventListener('change', onInventoryInputChange);
        input.addEventListener('input', onInventoryInputChange);
      });

      // Listeners para los inputs de no operativos y sin solución
      document.querySelectorAll('.status-input').forEach((input) => {
        input.addEventListener('change', onStatusInputChange);
        input.addEventListener('input', onStatusInputChange);
      });

      // Toggle para los desplegables
      document.querySelectorAll('.status-dropdown-toggle').forEach((button) => {
        button.addEventListener('click', () => {
          button.closest('.status-dropdown').classList.toggle('open');
        });
      });
    }

    async function onInventoryInputChange(event) {
      const input = event.target;
      const idx = parseInt(input.dataset.itemIndex);
      const newQty = parseInt(input.value) || 0;
      const item = inventoryItems[idx];

      if (!item) return;

      // Guardar al servidor
      try {
        const response = await inventoryFetch({
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: item.name,
            owner: String(newQty),
            non_operative: item.non_operative || '0',
            no_solution: item.no_solution || '0'
          })
        });

        if (response.ok) {
          item.qty = newQty;
          item.updated_at = new Date().toISOString();
          lastSyncTime = Date.now();
          updateReportText();
          statusMessage.textContent = `${item.name} actualizado en tiempo real.`;
          setTimeout(() => {
            statusMessage.textContent = 'Sincronizado local';
          }, 2000);
        }
      } catch (error) {
        statusMessage.textContent = 'Error al sincronizar con servidor.';
        console.error('Error:', error);
      }
    }

    async function onStatusInputChange(event) {
      const input = event.target;
      const idx = parseInt(input.dataset.itemIndex);
      const field = input.dataset.field;
      const value = parseInt(input.value) || 0;
      const item = inventoryItems[idx];

      if (!item || !field) return;

      // Actualizar estado local primero para evitar condiciones de carrera
      item[field] = String(value);
      item.updated_at = new Date().toISOString();
      updateReportText();

      try {
        const response = await inventoryFetch({
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: item.name,
            owner: String(item.qty),
            non_operative: item.non_operative || '0',
            no_solution: item.no_solution || '0'
          })
        });

        if (response.ok) {
          statusMessage.textContent = `${item.name} (${field === 'non_operative' ? 'No operativos' : 'Sin solución'}) actualizado.`;
          setTimeout(() => {
            statusMessage.textContent = 'Sincronizado local';
          }, 2000);
        }
      } catch (error) {
        statusMessage.textContent = 'Error al sincronizar con servidor.';
        console.error('Error:', error);
      }
    }

    async function pollInventoryChanges() {
      try {
        const response = await inventoryFetch();
        const remoteInventory = await response.json();
        if (!response.ok || !Array.isArray(remoteInventory)) return;

        let hasChanges = false;

        remoteInventory.forEach((serverItem) => {
          const localItem = inventoryItems.find((i) => i.name === serverItem.name);
          const serverQty = parseInt(serverItem.owner || serverItem.borrower || '0') || 0;
          const serverNoOp = serverItem.non_operative || '0';
          const serverNoSol = serverItem.no_solution || '0';

          if (!localItem) {
            inventoryItems.push({ name: serverItem.name, qty: serverQty, non_operative: serverNoOp, no_solution: serverNoSol, updated_at: serverItem.updated_at });
            hasChanges = true;
          } else if (localItem.qty !== serverQty || localItem.non_operative !== serverNoOp || localItem.no_solution !== serverNoSol) {
            localItem.qty = serverQty;
            localItem.non_operative = serverNoOp;
            localItem.no_solution = serverNoSol;
            localItem.updated_at = serverItem.updated_at;
            hasChanges = true;
          }
        });

        if (hasChanges) {
          renderInventoryCards();
          updateReportText();
          
          // Notificación visual mejorada con animación
          const badge = document.querySelector('.status-badge');
          if (badge) {
            badge.style.animation = 'none';
            setTimeout(() => {
              badge.style.animation = 'pulse 0.6s ease-in-out';
            }, 10);
          }
          
          statusMessage.textContent = 'Cambios detectados de otros dispositivos...';
          setTimeout(() => {
            statusMessage.textContent = 'Sincronizado local';
          }, 4000);
        }
      } catch (error) {
        console.error('Error al sincronizar:', error);
      }
    }

    // Registrar Service Worker para sincronización en background
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then((registration) => {
        console.log('✅ Service Worker registrado');
        
        // Escuchar mensajes del Service Worker
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data.type === 'INVENTORY_SYNC') {
            const data = event.data.data;
            if (Array.isArray(data)) {
              let hasChanges = false;
              
              data.forEach((serverItem) => {
                const localItem = inventoryItems.find((i) => i.name === serverItem.name);
                const serverQty = parseInt(serverItem.owner || serverItem.borrower || '0') || 0;
                const serverNoOp = serverItem.non_operative || '0';
                const serverNoSol = serverItem.no_solution || '0';
                
                if (!localItem) {
                  inventoryItems.push({ name: serverItem.name, qty: serverQty, non_operative: serverNoOp, no_solution: serverNoSol, updated_at: serverItem.updated_at });
                  hasChanges = true;
                } else if (localItem.qty !== serverQty || localItem.non_operative !== serverNoOp || localItem.no_solution !== serverNoSol) {
                  localItem.qty = serverQty;
                  localItem.non_operative = serverNoOp;
                  localItem.no_solution = serverNoSol;
                  localItem.updated_at = serverItem.updated_at;
                  hasChanges = true;
                }
              });
              
              if (hasChanges) {
                renderInventoryCards();
                updateReportText();
                
                // Notificación visual
                const badge = document.querySelector('.status-badge');
                if (badge) {
                  badge.style.animation = 'none';
                  setTimeout(() => {
                    badge.style.animation = 'pulse 0.6s ease-in-out';
                  }, 10);
                }
                
                statusMessage.textContent = '🔄 Sincronizado desde background';
                setTimeout(() => {
                  statusMessage.textContent = 'Sincronizado local';
                }, 4000);
              }
            }
          }
        });
        
        // Notificar al SW que la página está activa
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({ type: 'CLIENTS_CLAIM' });
        }
      }).catch((error) => {
        console.log('Error al registrar Service Worker:', error);
      });
    }

    // Cargar inventario al iniciar
    loadInventoryFromServer();

    // Hacer polling cada 2 segundos (más rápido ahora que tenemos SW)
    setInterval(pollInventoryChanges, 2000);

    function closeInventoryMenu() {

      document.body.classList.remove('sidebar-open');
      document.body.classList.remove('sidebar-collapsed');
      menuToggle.setAttribute('aria-expanded', 'false');
      inventoryBackdrop.hidden = true;
    }

    function toggleInventoryMenu() {
      const isMobile = window.innerWidth <= 760;
      if (isMobile) {
        const isOpen = document.body.classList.toggle('sidebar-open');
        inventoryBackdrop.hidden = !isOpen;
        menuToggle.setAttribute('aria-expanded', String(isOpen));
        return;
      }

      const isCollapsed = document.body.classList.toggle('sidebar-collapsed');
      menuToggle.setAttribute('aria-expanded', String(!isCollapsed));
      inventoryBackdrop.hidden = true;
    }

    menuToggle.addEventListener('click', toggleInventoryMenu);
    inventoryBackdrop.addEventListener('click', closeInventoryMenu);

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(storageKey) || '[]');
      } catch {
        return [];
      }
    }

    function saveHistory(value) {
      const history = getHistory();
      const entry = { id: Date.now(), text: value.trim(), date: new Date().toLocaleString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) };
      const updated = [entry, ...history].slice(0, 8);
      localStorage.setItem(storageKey, JSON.stringify(updated));
      renderHistory();
    }

    function renderHistory() {
      const history = getHistory();
      if (!history.length) {
        savedList.innerHTML = '<p class="small-note">Todavía no hay registros guardados.</p>';
        return;
      }

      savedList.innerHTML = history.map((entry) => `
        <button class="saved-item" type="button" data-id="${entry.id}">${entry.date}</button>
      `).join('');

      [...savedList.querySelectorAll('.saved-item')].forEach((button) => {
        button.addEventListener('click', () => {
          const item = getHistory().find((entry) => String(entry.id) === button.dataset.id);
          if (!item) return;
          reportText.value = item.text;
          statusMessage.textContent = 'Registro cargado desde guardados.';
        });
      });
    }

    renderHistory();

    document.getElementById('copyButton').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(reportText.value.trim());
        statusMessage.textContent = 'Texto copiado al portapapeles.';
      } catch {
        statusMessage.textContent = 'No se pudo copiar automáticamente, pero puedes seleccionar y copiar el texto.';
      }
    });

    document.getElementById('saveButton').addEventListener('click', () => {
      const value = reportText.value.trim();
      localStorage.setItem('splash-inventory-report', value);
      saveHistory(value);
      statusMessage.textContent = 'Registro guardado en este equipo.';
    });

    document.getElementById('shareButton').addEventListener('click', () => {
      const text = encodeURIComponent(reportText.value.trim());
      window.open(`https://wa.me/?text=${text}`, '_blank', 'noopener,noreferrer');
    });
  </script>
</body>
</html>
